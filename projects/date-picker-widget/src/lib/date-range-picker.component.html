<div
  #anchorEl
  class="w-full max-w-md"
  [class.inline-flex]="triggerMode() === 'split'"
  [class.items-center]="triggerMode() === 'split'"
  [class.gap-2]="triggerMode() === 'split'"
  [class.inline-block]="triggerMode() === 'combined'"
>
  <div class="contents" [class.hidden]="triggerMode() !== 'split'">
    <input
      #startInputEl
      type="text"
      role="combobox"
      aria-haspopup="dialog"
      aria-label="起始日期"
      autocomplete="off"
      class="w-full rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground outline-none focus:ring-2 focus:ring-primary"
      [class.border-red-500]="startInvalid()"
      [placeholder]="placeholder()"
      [value]="startText()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-invalid]="startInvalid() ? true : null"
      [attr.aria-controls]="dialogId"
      (focus)="onStartInputFocus()"
      (input)="onStartInputChange($any($event.target).value)"
    />
    <span class="text-muted" aria-hidden="true">–</span>
    <input
      #endInputEl
      type="text"
      role="combobox"
      aria-haspopup="dialog"
      aria-label="結束日期"
      autocomplete="off"
      class="w-full rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground outline-none focus:ring-2 focus:ring-primary"
      [class.border-red-500]="endInvalid()"
      [placeholder]="placeholder()"
      [value]="endText()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-invalid]="endInvalid() ? true : null"
      [attr.aria-controls]="dialogId"
      (focus)="onEndInputFocus()"
      (input)="onEndInputChange($any($event.target).value)"
    />
  </div>

  <input
    #combinedInputEl
    type="text"
    role="combobox"
    aria-haspopup="dialog"
    aria-label="日期範圍"
    autocomplete="off"
    readonly
    class="w-full cursor-pointer rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground outline-none focus:ring-2 focus:ring-primary"
    [class.hidden]="triggerMode() !== 'combined'"
    [class.border-red-500]="startInvalid() || endInvalid()"
    [placeholder]="placeholder()"
    [value]="combinedText()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-invalid]="startInvalid() || endInvalid() ? true : null"
    [attr.aria-controls]="dialogId"
    (focus)="onCombinedInputFocus()"
    (click)="open()"
  />
</div>

<sanring-date-picker-overlay-shell [connectedTo]="anchorElRef" (closed)="onShellClosed()">
  <div
    #gridEl
    [id]="dialogId"
    role="dialog"
    aria-modal="false"
    aria-label="選擇日期範圍"
    tabindex="0"
    class="rounded-lg border border-border bg-surface p-4 shadow-lg outline-none focus-within:ring-2 focus-within:ring-primary"
    (keydown)="onGridKeydown($event)"
  >
    <div [class]="engine.monthGrids().length > 1 ? 'flex gap-6' : 'block'">
      @for (monthGrid of engine.monthGrids(); track $index) {
        <div class="min-w-60 flex-1">
          <div class="mb-4 flex items-center justify-between">
            <button
              type="button"
              aria-label="上一月"
              class="rounded p-1 text-muted hover:bg-surface-strong"
              (click)="engine.prevMonth()"
            >
              ‹
            </button>
            <span class="font-semibold text-foreground">{{ currentMonthLabel(monthGrid) }}</span>
            <button
              type="button"
              aria-label="下一月"
              class="rounded p-1 text-muted hover:bg-surface-strong"
              (click)="engine.nextMonth()"
            >
              ›
            </button>
          </div>

          <div
            class="mb-1 grid grid-cols-7 gap-1 text-center text-xs font-medium text-muted"
            role="row"
            aria-hidden="true"
          >
            @for (label of weekdayLabels(); track label) {
              <span>{{ label }}</span>
            }
          </div>

          <div
            class="grid grid-cols-7 gap-1"
            role="grid"
            [attr.aria-label]="currentMonthLabel(monthGrid)"
          >
            @for (week of toWeeks(monthGrid); track $index) {
              <div role="row" class="contents">
                @for (day of week; track day.date.getTime()) {
                  <button
                    role="gridcell"
                    type="button"
                    [disabled]="day.isDisabled"
                    [attr.aria-selected]="day.isSelected ? true : null"
                    [attr.aria-disabled]="day.isDisabled ? true : null"
                    [attr.aria-label]="dayAriaLabel(day)"
                    class="aspect-square rounded text-sm transition-colors active:brightness-90"
                    [class.text-muted]="!day.isCurrentMonth && !day.isInRange && !day.isSelected"
                    [class.text-foreground]="day.isCurrentMonth && !day.isSelected"
                    [class.bg-primary]="day.isSelected"
                    [class.text-primary-foreground]="day.isSelected"
                    [class.bg-primary/20]="day.isInRange && !day.isSelected"
                    [class.ring-2]="day.isFocused"
                    [class.ring-primary]="day.isFocused"
                    [class.font-bold]="day.isToday && !day.isSelected"
                    [class.hover:bg-surface-strong]="
                      !day.isSelected && !day.isDisabled && !day.isInRange
                    "
                    [class.hover:brightness-95]="day.isSelected || day.isInRange"
                    [class.opacity-40]="day.isDisabled"
                    [class.cursor-not-allowed]="day.isDisabled"
                    [class.line-through]="day.isDisabled"
                    (click)="selectDate(day.date)"
                  >
                    {{ day.date.getDate() }}
                  </button>
                }
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</sanring-date-picker-overlay-shell>
