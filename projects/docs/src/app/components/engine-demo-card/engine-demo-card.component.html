<sanring-card class="w-full overflow-hidden">
  <sanring-card-content class="p-5 md:p-6">
    <div class="flex flex-col items-start gap-6 md:flex-row md:items-stretch">
      <div [class]="inputAreaClass()">
        <ng-content select="[demoInput]" />
      </div>

      <div class="flex flex-1 flex-col justify-between gap-6 pt-1 md:pt-2">
        <div>
          <h3 sanringCardTitle class="text-base">{{ title() }}</h3>
          <p sanringCardDescription class="mt-1 text-sm text-muted" [innerHTML]="description()"></p>
        </div>
        <ng-content select="[demoResult]" />
      </div>
    </div>
  </sanring-card-content>
</sanring-card>
