<nav [class]="vertical() ? 'flex flex-col items-stretch gap-1' : 'flex items-center gap-1'">
  @for (item of items; track item.path) {
    <a
      sanringBtn
      variant="ghost"
      size="sm"
      class="rounded-md"
      [routerLink]="item.path"
      routerLinkActive
      #rla="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: false }"
      [class.bg-surface-strong]="rla.isActive"
      [class.text-foreground]="rla.isActive"
      [class.text-muted]="!rla.isActive"
      [class.w-full]="vertical()"
      [class.justify-start]="vertical()"
    >
      {{ item.label }}
    </a>
  }
</nav>
