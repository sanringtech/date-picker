<aside class="w-64 shrink-0 pr-8">
  <nav>
    @for (section of sections(); track section.label) {
      <div class="mb-6">
        @if (section.path) {
          <a
            [routerLink]="section.path"
            routerLinkActive
            #sectionRla="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }"
            class="mb-2 block text-xs font-semibold uppercase tracking-wider no-underline transition-colors hover:text-foreground"
            [class]="sectionRla.isActive ? 'text-foreground' : 'text-muted'"
          >
            {{ section.label }}
          </a>
        } @else {
          <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-muted">
            {{ section.label }}
          </p>
        }
        <ul class="space-y-0.5 list-none p-0 m-0">
          @for (item of section.items; track item.path) {
            <li>
              <a
                sanringBtn
                variant="ghost"
                size="sm"
                [routerLink]="item.path"
                routerLinkActive
                #rla="routerLinkActive"
                [class]="
                  (rla.isActive ? 'bg-surface-strong text-foreground' : 'text-muted') +
                  ' w-full justify-between no-underline'
                "
              >
                {{ item.label }}
                @if (item.badge === 'soon') {
                  <span
                    class="rounded-full bg-surface px-1.5 py-0.5 text-[10px] font-medium text-muted"
                  >
                    soon
                  </span>
                }
                @if (item.badge === 'wip') {
                  <span
                    class="rounded-full bg-primary/15 px-1.5 py-0.5 text-[10px] font-medium text-primary"
                  >
                    wip
                  </span>
                }
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</aside>
