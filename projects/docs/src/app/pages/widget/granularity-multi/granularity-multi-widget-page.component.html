<app-page-header [title]="t().pageTitle" [description]="t().pageDescription" />

<app-widget-demo
  controlClass="w-full max-w-sm"
  [title]="t().cardTitle"
  [description]="t().cardDescription"
  [resultLabel]="t().selectedLabel"
  [resultValue]="formatSelected()"
>
  <sanring-date-granularity-multi-picker
    widgetControl
    granularity="year"
    [locale]="locale"
    [(selectedDates)]="selectedDates"
    [placeholder]="t().placeholder"
  />
</app-widget-demo>
