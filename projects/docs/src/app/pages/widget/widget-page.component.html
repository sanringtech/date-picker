<app-page-header
  title="Widget Layer"
  description='Composed Widget 層（<code class="font-mono text-xs">@sanring/date-picker-widget</code>）： 在 Engine 之上提供預設樣式的 Popover DatePicker 元件。'
/>

<sanring-card class="w-full max-w-sm overflow-hidden">
  <sanring-card-content class="p-5 md:p-6">
    <h3 sanringCardTitle>DatePicker（W1，Single 模式）</h3>
    <p sanringCardDescription class="mb-4">
      點擊或聚焦輸入框開啟月曆；方向鍵在網格內移動，Enter/Space 選取，Escape 關閉。
    </p>

    <sanring-date-picker [locale]="locale" [(selectedDate)]="selectedDate" placeholder="選擇日期" />

    <p class="mt-4 text-sm text-muted">已選：{{ formatSelected() }}</p>
  </sanring-card-content>
</sanring-card>
