<app-page-header [title]="t().pageTitle" [description]="t().pageDescription" />

<app-widget-demo
  controlClass="w-full max-w-2xl"
  [title]="t().cardTitle"
  [description]="t().cardDescription"
  [resultLabel]="t().selectedLabel"
  [resultValue]="formatSelected()"
>
  <sanring-date-time-range-picker
    widgetControl
    [locale]="locale"
    [(selectedRange)]="selectedRange"
    [placeholder]="t().placeholder"
  />
</app-widget-demo>
