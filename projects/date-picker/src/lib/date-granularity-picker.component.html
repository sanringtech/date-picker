<div class="relative inline-block w-full max-w-[16rem]">
  <input
    #inputEl
    type="text"
    role="combobox"
    aria-haspopup="dialog"
    autocomplete="off"
    readonly
    class="w-full rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground outline-none focus:ring-2 focus:ring-primary"
    [placeholder]="placeholder()"
    [value]="inputValue()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="dialogId"
    (focus)="onInputFocus()"
  />
</div>

<sanring-date-picker-overlay-shell [connectedTo]="inputElRef">
  <div
    #gridEl
    [id]="dialogId"
    role="dialog"
    aria-modal="false"
    aria-label="選擇期間"
    tabindex="0"
    class="max-h-[85vh] max-w-[calc(100vw-2rem)] overflow-y-auto rounded-lg border border-border bg-surface p-4 shadow-lg outline-none focus-within:ring-2 focus-within:ring-primary"
    (keydown)="onGridKeydown($event)"
  >
    <div class="mb-4 flex items-center justify-between">
      <button
        type="button"
        aria-label="上一頁"
        class="rounded p-1 text-muted hover:bg-surface-strong"
        (click)="engine.prevYear()"
      >
        ‹
      </button>
      <span class="font-semibold text-foreground">{{ headerLabel() }}</span>
      <button
        type="button"
        aria-label="下一頁"
        class="rounded p-1 text-muted hover:bg-surface-strong"
        (click)="engine.nextYear()"
      >
        ›
      </button>
    </div>

    <div [class]="'grid gap-1.5 ' + gridColsClass()" role="grid" [attr.aria-label]="headerLabel()">
      @for (cell of engine.granularityGrids(); track cell.date.getTime(); let i = $index) {
        <button
          role="gridcell"
          type="button"
          [disabled]="cell.isDisabled"
          [attr.aria-selected]="cell.isSelected ? true : null"
          [attr.aria-disabled]="cell.isDisabled ? true : null"
          class="rounded px-2 py-2.5 text-center text-sm transition-colors active:brightness-90"
          [class.text-foreground]="!cell.isSelected"
          [class.bg-primary]="cell.isSelected"
          [class.text-primary-foreground]="cell.isSelected"
          [class.font-bold]="cell.isCurrentPeriod && !cell.isSelected"
          [class.ring-2]="cell.isFocused"
          [class.ring-primary]="cell.isFocused"
          [class.hover:bg-surface-strong]="!cell.isSelected && !cell.isDisabled"
          [class.opacity-40]="cell.isDisabled"
          [class.cursor-not-allowed]="cell.isDisabled"
          (click)="selectDate(cell.date)"
        >
          {{ cellLabel(cell, i) }}
        </button>
      }
    </div>
  </div>
</sanring-date-picker-overlay-shell>
