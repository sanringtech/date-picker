name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'projects/docs/**'
      - 'projects/date-picker-core/**'
      - 'projects/date-picker/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npx ng build docs --configuration production --base-href /

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix SPA routing for GitHub Pages
        run: cp dist/docs/browser/index.html dist/docs/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
